name: Cập nhật lịch sử tiến bộ

on:
  push:
    branches: [main]
    paths: [index.html, tools/build-history.mjs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-history.mjs
      - name: Commit history.json
        run: |
          git diff --quiet history.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Cập nhật history.json"
          git push
